<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worth Wise — Ask before you buy.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Ambient grain / vignette layer -->
<div class="grain" aria-hidden="true"></div>

<!-- Toast host -->
<div id="toast-host" class="toast-host"></div>

<!-- App shell: sidebar + topbar + routed view mount -->
<div id="app-shell" class="app-shell">

  <aside id="sidebar" class="sidebar"></aside>

  <div id="mobile-bar" class="mobile-bar"></div>

  <main id="view" class="view"></main>

  <nav id="tab-bar" class="tab-bar"></nav>
</div>

<!-- ============================================================
     TEMPLATES — cloned into #view by app.js. Keeping them as
     <template> tags means no page reload, no per-route HTML files,
     and the whole thing still ships as one static bundle.
============================================================= -->

<template id="tpl-landing">
  <div class="scene scene-landing">
    <header class="landing-nav">
      <div class="brand"><span class="brand-mark">WW</span><span class="brand-word">Worth Wise</span></div>
      <div class="landing-nav-actions">
        <button class="link-btn" data-nav="#/auth?mode=login">Sign in</button>
        <button class="btn btn-solid" data-nav="#/auth?mode=register">Get started</button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-left">
        <p class="kicker">A financial decision engine</p>
        <h1 class="hero-title">Before you buy.<br><span class="hero-title-accent">Ask Worth&nbsp;Wise.</span></h1>
        <p class="hero-sub">Every purchase gets weighed against your income, your goals, and the next twelve months of your life — before you spend a rupee.</p>
        <div class="hero-actions">
          <button class="btn btn-solid btn-lg" data-nav="#/auth?mode=register">Start deciding smarter</button>
          <button class="link-btn link-btn-arrow" data-scroll="how-it-works">See how it works</button>
        </div>
        <div class="hero-proof">
          <div class="proof-chip"><span class="proof-num">₹0</span><span>fabricated data — ever</span></div>
          <div class="proof-chip"><span class="proof-num">JWT</span><span>secured, stateless auth</span></div>
        </div>
      </div>

      <div class="hero-right">
        <div class="verdict-stage" id="landing-verdict-stage">
          <div class="purse-scene" aria-hidden="true">
            <div class="purse-body">
              <div class="purse-flap"></div>
              <div class="note note-a">₹</div>
              <div class="note note-b">₹</div>
            </div>
            <div class="hand-reach">
              <svg viewBox="0 0 64 64" class="hand-icon"><path d="M20 40 C16 34 15 24 17 18 C18 14 24 14 24 19 L24 28 M24 19 L24 30 M29 18 C29 14 34 14 34 19 L34 30 M34 19 C34 15 39 15 39 20 L39 31 M39 21 C39 17 44 18 44 22 L44 36 C44 46 38 52 30 52 C22 52 17 47 15 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="verdict-card">
            <div class="verdict-eyebrow">Live example</div>
            <div class="verdict-item">
              <span class="verdict-item-label">Wireless headphones</span>
              <span class="verdict-item-price">₹18,500</span>
            </div>
            <div class="verdict-dial-wrap">
              <svg viewBox="0 0 160 96" class="verdict-dial">
                <path d="M14 88 A66 66 0 0 1 146 88" class="dial-track"/>
                <path d="M14 88 A66 66 0 0 1 146 88" class="dial-fill" id="landing-dial-fill"/>
              </svg>
              <div class="verdict-word" id="landing-verdict-word">WAIT</div>
            </div>
            <p class="verdict-note">Buying now delays your <b>Goa Trip</b> goal by 3 months. Worth Wise suggests waiting 6 weeks.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="how-it-works" id="how-it-works">
      <p class="section-kicker">How it works</p>
      <div class="how-grid">
        <div class="how-card">
          <span class="how-index">01</span>
          <h3>Tell it what you want to buy</h3>
          <p>Product, price, category, and why you want it. Takes fifteen seconds.</p>
        </div>
        <div class="how-card">
          <span class="how-index">02</span>
          <h3>It checks your real finances</h3>
          <p>Income, savings, existing EMIs, and every active goal — cross-referenced live.</p>
        </div>
        <div class="how-card">
          <span class="how-index">03</span>
          <h3>Get a verdict, not a lecture</h3>
          <p>Buy now, wait, or skip — with the exact reasoning and a safer price range.</p>
        </div>
      </div>
    </section>

    <section class="value-strip" id="value">
      <div class="value-row">
        <h2>Your money, modeled honestly.</h2>
        <p>No generic budgeting rules. Worth Wise runs your actual numbers through a decision engine tuned to your risk tolerance and goals — every single time you're tempted to spend.</p>
      </div>
    </section>

    <footer class="landing-footer">
      <span>Worth Wise — a personal purchase decision engine.</span>
    </footer>
  </div>
</template>

<template id="tpl-auth">
  <div class="scene scene-auth">
    <div class="auth-side">
      <div class="brand brand-on-dark"><span class="brand-mark">WW</span><span class="brand-word">Worth Wise</span></div>
      <blockquote class="auth-quote">"The best financial tool is the one that stops you thirty seconds before a bad decision."</blockquote>
      <div class="auth-side-stat">
        <div class="stat-ring" id="auth-side-ring"></div>
        <div>
          <div class="stat-num">82</div>
          <div class="stat-label">avg. financial health score among decisive users</div>
        </div>
      </div>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-tabs">
        <button class="auth-tab" data-auth-tab="login">Sign in</button>
        <button class="auth-tab" data-auth-tab="register">Create account</button>
        <div class="auth-tab-indicator"></div>
      </div>

      <form id="login-form" class="auth-form">
        <h2>Welcome back</h2>
        <p class="auth-form-sub">Pick up right where your finances left off.</p>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <div class="field-error" id="login-error"></div>
        <button type="submit" class="btn btn-solid btn-block btn-lg">
          <span class="btn-label">Sign in</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <form id="register-form" class="auth-form">
        <h2>Create your account</h2>
        <p class="auth-form-sub">Takes under a minute. No credit card, obviously.</p>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
        </label>
        <div class="field-error" id="register-error"></div>
        <button type="submit" class="btn btn-solid btn-block btn-lg">
          <span class="btn-label">Create account</span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </div>
  </div>
</template>

<template id="tpl-dashboard">
  <div class="scene scene-app" data-page="dashboard">
    <header class="page-head">
      <div>
        <p class="page-kicker" id="dash-greeting-time">Good afternoon</p>
        <h1 id="dash-greeting-name">Command Center</h1>
      </div>
      <button class="btn btn-solid" data-nav="#/analyze">
        <svg viewBox="0 0 24 24" class="icon-16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
        Should I buy this?
      </button>
    </header>

    <div class="skeleton-zone" id="dash-skeleton"></div>

    <div id="dash-content" class="dash-grid hidden">
      <!-- Health hero -->
      <section class="card card-health">
        <div class="health-left">
          <p class="card-eyebrow">Financial Health</p>
          <div class="health-score-row">
            <span class="health-score" id="health-score">--</span>
            <span class="health-label" id="health-label">—</span>
          </div>
          <div class="health-bar-track"><div class="health-bar-fill" id="health-bar-fill"></div></div>
          <div class="health-facts" id="health-facts"></div>
        </div>
        <div class="health-right">
          <div class="xp-ring-wrap">
            <svg viewBox="0 0 120 120" class="xp-ring">
              <circle cx="60" cy="60" r="52" class="xp-ring-track"/>
              <circle cx="60" cy="60" r="52" class="xp-ring-fill" id="xp-ring-fill"/>
            </svg>
            <div class="xp-ring-center">
              <span class="xp-level" id="xp-level">Lv.1</span>
              <span class="xp-caption">Guardian</span>
            </div>
          </div>
          <div class="streak-chip" id="streak-chip">
            <svg viewBox="0 0 24 24" class="icon-14"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c1.5 1.2 2 3 2 4.5A5.5 5.5 0 0112 21a5.5 5.5 0 01-5-8c1-2.2 3-3 3-6.5C10 4.7 11 3 12 2z" fill="currentColor"/></svg>
            <span id="streak-text">0 decision streak</span>
          </div>
        </div>
      </section>

      <!-- Money stats -->
      <section class="stat-row">
        <div class="stat-card">
          <p class="card-eyebrow">Monthly surplus</p>
          <p class="stat-value" id="stat-surplus">₹0</p>
          <p class="stat-sub" id="stat-surplus-sub">income minus expenses</p>
        </div>
        <div class="stat-card">
          <p class="card-eyebrow">Current savings</p>
          <p class="stat-value" id="stat-savings">₹0</p>
          <p class="stat-sub" id="stat-savings-sub">emergency buffer</p>
        </div>
        <div class="stat-card">
          <p class="card-eyebrow">Existing EMI load</p>
          <p class="stat-value" id="stat-emi">₹0</p>
          <p class="stat-sub" id="stat-emi-sub">per month</p>
        </div>
      </section>

      <!-- Goals -->
      <section class="card card-goals">
        <div class="card-head">
          <h2>Active goals</h2>
          <button class="link-btn" data-nav="#/goals">Manage all →</button>
        </div>
        <div id="dash-goals-list" class="goal-mini-list"></div>
      </section>

      <!-- Recent decisions -->
      <section class="card card-recent">
        <div class="card-head">
          <h2>Recent decisions</h2>
          <button class="link-btn" data-nav="#/history">Full history →</button>
        </div>
        <div id="dash-recent-list" class="recent-list"></div>
      </section>
    </div>

    <div id="dash-error" class="state-block hidden"></div>
  </div>
</template>

<template id="tpl-analyze">
  <div class="scene scene-app" data-page="analyze">
    <header class="page-head">
      <div>
        <p class="page-kicker">Decision engine</p>
        <h1>Should I buy this?</h1>
      </div>
    </header>

    <div class="analyze-stage" id="analyze-stage">

      <!-- STEP: form -->
      <form id="analyze-form" class="analyze-panel panel-form">
        <div class="form-grid">
          <label class="field field-span2">
            <span>What are you buying?</span>
            <input type="text" name="productName" required placeholder="e.g. Sony WH-1000XM5">
          </label>
          <label class="field">
            <span>Category</span>
            <input type="text" name="category" required placeholder="Electronics">
          </label>
          <label class="field">
            <span>Price (₹)</span>
            <input type="number" name="price" required min="1" step="1" placeholder="18500">
          </label>
          <label class="field">
            <span>Purchase type</span>
            <select name="purchaseType">
              <option value="ONE_TIME">Pay in full</option>
              <option value="EMI">EMI</option>
            </select>
          </label>
          <label class="field emi-field hidden">
            <span>Monthly EMI (₹)</span>
            <input type="number" name="monthlyEmi" min="0" step="1" placeholder="1500">
          </label>
          <label class="field emi-field hidden">
            <span>EMI duration (months)</span>
            <input type="number" name="durationMonths" min="1" step="1" placeholder="12">
          </label>
          <label class="field field-span2">
            <span>Why do you want it? <i>(optional)</i></span>
            <textarea name="reason" rows="2" placeholder="My current one broke, and I use headphones daily for work."></textarea>
          </label>
        </div>
        <div class="field-error" id="analyze-error"></div>
        <button type="submit" class="btn btn-solid btn-lg btn-block">
          <span class="btn-label">Analyze this purchase</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <!-- STEP: analyzing sequence -->
      <div class="analyze-panel panel-loading hidden">
        <div class="scan-orb"><div class="scan-orb-core"></div></div>
        <h3 id="analyze-loading-headline">Analyzing your purchase…</h3>
        <ul class="scan-steps" id="scan-steps">
          <li data-step="capacity"><span class="scan-dot"></span> Checking spending capacity</li>
          <li data-step="goals"><span class="scan-dot"></span> Cross-referencing your goals</li>
          <li data-step="afford"><span class="scan-dot"></span> Modeling affordability</li>
          <li data-step="decide"><span class="scan-dot"></span> Calculating the verdict</li>
        </ul>
      </div>

      <!-- STEP: result -->
      <div class="analyze-panel panel-result hidden" id="analyze-result">
        <div class="result-top">
          <div class="result-dial-wrap">
            <svg viewBox="0 0 200 120" class="result-dial">
              <path d="M16 110 A84 84 0 0 1 184 110" class="dial-track"/>
              <path d="M16 110 A84 84 0 0 1 184 110" class="dial-fill" id="result-dial-fill"/>
            </svg>
            <div class="result-dial-center">
              <span class="result-score" id="result-score">0</span>
              <span class="result-score-label">score</span>
            </div>
          </div>
          <div class="result-verdict-block">
            <span class="verdict-badge" id="result-badge">—</span>
            <h2 id="result-product-name">—</h2>
            <p id="result-price-line">—</p>
          </div>
        </div>

        <div class="result-metrics" id="result-metrics"></div>

        <div class="result-section" id="result-reasons-section">
          <h3>Why</h3>
          <ul class="reason-list" id="result-reasons"></ul>
        </div>

        <div class="result-section hidden" id="result-alt-section">
          <h3>Alternatives worth a look</h3>
          <div class="alt-list" id="result-alternatives"></div>
        </div>

        <div class="result-section hidden" id="result-plan-section">
          <h3>Suggested plan</h3>
          <ol class="plan-list" id="result-plan"></ol>
        </div>

        <div class="result-section hidden" id="result-ai-section">
          <h3>Worth Wise's take</h3>
          <p class="ai-explanation" id="result-ai-text"></p>
        </div>

        <div class="result-actions">
          <button class="btn btn-ghost" id="result-again-btn">Analyze another</button>
          <button class="btn btn-solid" data-nav="#/history">View in history</button>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-goals">
  <div class="scene scene-app" data-page="goals">
    <header class="page-head">
      <div>
        <p class="page-kicker">Progression</p>
        <h1>Your goals</h1>
      </div>
      <button class="btn btn-solid" id="goal-new-btn">
        <svg viewBox="0 0 24 24" class="icon-16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
        New goal
      </button>
    </header>

    <div class="skeleton-zone" id="goals-skeleton"></div>
    <div id="goals-grid" class="goals-grid hidden"></div>
    <div id="goals-empty" class="state-block hidden">
      <h3>No goals yet</h3>
      <p>Set your first goal and Worth Wise will factor it into every purchase decision.</p>
      <button class="btn btn-solid" id="goals-empty-cta">Create a goal</button>
    </div>
    <div id="goals-error" class="state-block hidden"></div>
  </div>

  <div class="modal-backdrop hidden" id="goal-modal-backdrop">
    <div class="modal" id="goal-modal">
      <div class="modal-head">
        <h2 id="goal-modal-title">New goal</h2>
        <button class="modal-close" id="goal-modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="goal-form" class="modal-body">
        <input type="hidden" name="id">
        <label class="field">
          <span>Goal name</span>
          <input type="text" name="name" required placeholder="Goa Trip">
        </label>
        <div class="field-row">
          <label class="field">
            <span>Target amount (₹)</span>
            <input type="number" name="targetAmount" required min="1" step="1">
          </label>
          <label class="field">
            <span>Already saved (₹)</span>
            <input type="number" name="currentAmount" min="0" step="1" value="0">
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Target date</span>
            <input type="date" name="targetDate" required>
          </label>
          <label class="field">
            <span>Priority</span>
            <select name="priority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </label>
        </div>
        <div class="field-error" id="goal-form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="goal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-solid">
            <span class="btn-label">Save goal</span>
            <span class="btn-spinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</template>

<template id="tpl-history">
  <div class="scene scene-app" data-page="history">
    <header class="page-head">
      <div>
        <p class="page-kicker">Track record</p>
        <h1>Decision history</h1>
      </div>
    </header>

    <div class="history-filters" id="history-filters">
      <button class="filter-chip active" data-filter="ALL">All</button>
      <button class="filter-chip" data-filter="BUY_NOW">Bought</button>
      <button class="filter-chip" data-filter="WAIT">Waited</button>
      <button class="filter-chip" data-filter="DONT_BUY">Skipped</button>
      <button class="filter-chip" data-filter="CONSIDER_ALTERNATIVE">Alternatives</button>
    </div>

    <div class="skeleton-zone" id="history-skeleton"></div>
    <div id="history-list" class="history-list hidden"></div>
    <div id="history-empty" class="state-block hidden">
      <h3>No decisions yet</h3>
      <p>Every purchase you analyze will show up here.</p>
      <button class="btn btn-solid" data-nav="#/analyze">Analyze your first purchase</button>
    </div>
    <div id="history-error" class="state-block hidden"></div>
  </div>

  <div class="modal-backdrop hidden" id="decision-modal-backdrop">
    <div class="modal modal-lg" id="decision-modal">
      <div class="modal-head">
        <h2 id="decision-modal-title">Decision</h2>
        <button class="modal-close" id="decision-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="decision-modal-body"></div>
    </div>
  </div>
</template>

<template id="tpl-profile">
  <div class="scene scene-app" data-page="profile">
    <header class="page-head">
      <div>
        <p class="page-kicker">Foundation</p>
        <h1>Financial profile</h1>
      </div>
    </header>

    <div class="skeleton-zone" id="profile-skeleton"></div>

    <form id="profile-form" class="profile-form hidden">
      <section class="card">
        <h2>Income &amp; savings</h2>
        <div class="field-row">
          <label class="field">
            <span>Monthly income (₹)</span>
            <input type="number" name="monthlyIncome" min="0" step="1">
          </label>
          <label class="field">
            <span>Current savings (₹)</span>
            <input type="number" name="currentSavings" min="0" step="1">
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Emergency fund target (₹)</span>
            <input type="number" name="emergencyFundTarget" min="0" step="1">
          </label>
          <label class="field">
            <span>Existing EMI / month (₹)</span>
            <input type="number" name="existingEmi" min="0" step="1">
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Monthly expense breakdown</h2>
        <p class="card-sub">Used to calculate your real spending capacity.</p>
        <div class="expense-grid" id="expense-grid"></div>
        <button type="button" class="link-btn" id="expense-add-btn">+ Add expense category</button>
      </section>

      <section class="card">
        <h2>Preferences</h2>
        <div class="field-row field-row-3">
          <label class="field">
            <span>Risk tolerance</span>
            <select name="riskTolerance">
              <option value="LOW">Low</option>
              <option value="MODERATE">Moderate</option>
              <option value="HIGH">High</option>
            </select>
          </label>
          <label class="field">
            <span>Saving priority</span>
            <select name="savingPriority">
              <option value="GOAL_FIRST">Goal first</option>
              <option value="BALANCED">Balanced</option>
              <option value="FLEXIBLE">Flexible</option>
            </select>
          </label>
          <label class="field">
            <span>Purchase preference</span>
            <select name="purchasePreference">
              <option value="VALUE_OVER_BRAND">Value over brand</option>
              <option value="QUALITY_FIRST">Quality first</option>
              <option value="BALANCED">Balanced</option>
            </select>
          </label>
        </div>
      </section>

      <div class="field-error" id="profile-error"></div>
      <div class="profile-save-bar">
        <span class="save-hint" id="profile-save-hint"></span>
        <button type="submit" class="btn btn-solid btn-lg">
          <span class="btn-label">Save profile</span>
          <span class="btn-spinner"></span>
        </button>
      </div>
    </form>

    <section class="card" id="settings-card">
      <h2>Account</h2>
      <p class="card-sub" id="account-email-line"></p>
      <button class="btn btn-ghost" id="logout-btn">Log out</button>
    </section>

    <div id="profile-error-block" class="state-block hidden"></div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
