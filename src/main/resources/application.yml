server:
  port: ${SERVER_PORT:${PORT:5000}}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:worth_wise}}
    username: ${DATABASE_USERNAME:${DB_USER:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

app:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-use-please}
    ttl-minutes: ${JWT_TTL_MINUTES:10080}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
