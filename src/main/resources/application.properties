server.port=${PORT:5000}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

app.seed-demo-data=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl-minutes=10080

app.openrouter.api-key=${APP_OPENROUTER_API_KEY}
app.openrouter.model=${APP_OPENROUTER_MODEL:minimax/minimax-m3:free}
serpapi.api.key=${SERPAPI_API_KEY:}

# Monthly per-user limits for the paid API calls (the deterministic decision itself is never limited)
app.limits.ai-monthly=${APP_LIMIT_AI_MONTHLY:30}
app.limits.google-monthly=${APP_LIMIT_GOOGLE_MONTHLY:10}

# "Try demo" abuse protection
app.demo.max-per-ip-per-day=${APP_DEMO_MAX_PER_IP_PER_DAY:2}
app.demo.max-per-day=${APP_DEMO_MAX_PER_DAY:100}

# Email OTP signup (Brevo HTTPS API; verify one sender address in Brevo, no domain needed)
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:Worthwise}
# local testing only: prints the OTP in the server log when no email service is configured
app.otp.dev-log=${APP_OTP_DEV_LOG:false}
# Chatbot: max LLM-backed replies per IP per hour (exact knowledge-base answers are never limited)
app.limits.chat-ai-per-ip-hour=${APP_LIMIT_CHAT_AI_PER_IP_HOUR:20}