<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorthWise – Product Showcase</title>
<style>
/* ===== Theme tokens (easy to customize) ===== */
:root{--bg:#050809;--green:#19e6a0;--cyan:#38d7f0;--amber:#f5b533;--red:#ef5350;--text:#eaf4f1;--muted:#8fa7a1}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow-x:hidden}
body{background:radial-gradient(60% 50% at 50% 55%,#0b2a28 0%,transparent 70%),radial-gradient(40% 40% at 15% 90%,#082022 0%,transparent 70%),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:100%;padding:40px 0}
h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 3D stage: perspective container ===== */
.stage{position:relative;width:min(1200px,100%);height:clamp(380px,52vw,500px);margin:0 auto;perspective:1100px;perspective-origin:50% 40%;overflow:hidden}
.track{position:absolute;inset:0;transform-style:preserve-3d}
.slot{position:absolute;left:50%;top:44%;width:var(--cw);height:calc(var(--cw)*1.38);margin:calc(var(--cw)*-0.69) 0 0 calc(var(--cw)*-0.5);will-change:transform,opacity;transform-style:preserve-3d}

/* ===== Card + continuous floating (different timing per card via --d / --t) ===== */
.card{position:relative;width:100%;height:100%;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(160deg,#16302d 0%,#0b1717 45%,#070e0e 100%);
  border:1px solid var(--ac);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 14px color-mix(in srgb,var(--ac) 25%,transparent);
  animation:float var(--t) ease-in-out var(--d) infinite;transition:transform .35s,box-shadow .35s}
@keyframes float{0%,100%{transform:translateY(-6px)}50%{transform:translateY(8px)}}
.card:hover{animation-play-state:paused;transform:translateY(-8px) scale(1.06) translateZ(60px);
  box-shadow:0 26px 50px rgba(0,0,0,.7),0 0 30px var(--ac);z-index:5}
.card.main{box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 28px color-mix(in srgb,var(--green) 55%,transparent);animation:float var(--t) ease-in-out var(--d) infinite,breathe 4s ease-in-out infinite}
/* Neon breathing on the focal card */
@keyframes breathe{0%,100%{box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 18px rgba(25,230,160,.35),0 0 50px rgba(25,230,160,.12)}
  50%{box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 34px rgba(25,230,160,.7),0 0 90px rgba(56,215,240,.28)}}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:clamp(9px,1.1vw,11.5px);font-weight:600;padding:4px 9px;border-radius:99px;
  color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,#0a1414);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.photo{flex:1;min-height:0;border-radius:12px;background:radial-gradient(circle at 50% 45%,#2a4a46 0%,#0d1b1b 80%);display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));border-radius:12px}
.name{font-size:clamp(11px,1.3vw,14px);font-weight:600}
.price{font-size:clamp(14px,1.9vw,21px);font-weight:700;letter-spacing:.2px}
.act{font-size:clamp(9.5px,1.1vw,11.5px);padding:6px 9px;border-radius:9px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);background:rgba(0,0,0,.35)}

/* ===== Reflection glow + neon ring beneath collection ===== */
.floor{position:absolute;left:50%;bottom:6%;width:78%;height:90px;transform:translateX(-50%);pointer-events:none}
.floor .glow{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(25,230,160,.38),rgba(56,215,240,.1) 45%,transparent 70%);filter:blur(12px);animation:reflect 4s ease-in-out infinite}
.floor .ring{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border-radius:50%;border:1px solid rgba(25,230,160,.45);box-shadow:0 0 16px rgba(25,230,160,.35),inset 0 0 14px rgba(25,230,160,.2)}
@keyframes reflect{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.dots{display:flex;gap:8px;justify-content:center;margin-top:6px}
.dots button{width:7px;height:7px;border-radius:50%;border:0;background:#2b3b39;cursor:pointer;padding:0;transition:.3s}
.dots button.on{background:var(--green);width:18px;border-radius:9px;box-shadow:0 0 8px var(--green)}

@media(max-width:700px){.stage{height:400px}.card{padding:8px;border-radius:16px}}
@media(prefers-reduced-motion:reduce){.card,.card.main,.floor .glow,.badge i{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1 class="sr">WorthWise product showcase</h1>
  <section class="stage" id="stage" aria-label="Featured products">
    <div class="floor" aria-hidden="true"><div class="glow"></div><div class="ring"></div></div>
    <div class="track" id="track"></div>
  </section>
  <div class="dots" id="dots" role="tablist" aria-label="Choose product"></div>
</main>

<script>
/* ===== Product data: edit names, prices, labels, images here ===== */
const PRODUCTS=[
 {name:"Running Shoes",price:"₹4,999",badge:"Great Buy",action:"Good Value",color:"#19e6a0",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVgpHF8Gw3Z9Vg2_janFvkaYEd1UD4qRxYgxJCBui4STZZ-EE9PtHGBoQ&s=10",alt:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80","https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg?auto=compress&cs=tinysrgb&w=500"]},
 {name:"Mobile Phone",price:"₹22,999",badge:"Wait 1–2 Weeks",action:"Better Time",color:"#f5b533",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMn_ljK6KrFiB5CqSq20QSAz7OMjt0_TYa1AP6dmPApw&s=10",alt:["https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&q=80","https://images.pexels.com/photos/788946/pexels-photo-788946.jpeg?auto=compress&cs=tinysrgb&w=500"]},
 {name:"Wireless Headphones",price:"₹8,499",badge:"Fits Your Goal",action:"Fits your goal",color:"#19e6a0",img:"https://www.sathya.store/img/product/FAb9jtNpEjJeGtMP.png",alt:["https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80","https://images.pexels.com/photos/3394650/pexels-photo-3394650.jpeg?auto=compress&cs=tinysrgb&w=500"]},
 {name:"High Heels",price:"₹3,499",badge:"Consider Alternatives",action:"Save ₹1,500+",color:"#f5b533",img:"https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcTnQDnTNgPWQojzh_EBfbyrEwc8NA4EVA-zP_H_15ymSY9udkSsszKBJPWvjTtw-K0VZkmvETIaIUPV5HeL9LtBwNnYCNIchyPAZlu4roOjAGuuREq_OlYM4NMYo-LUDGfe809p8Zk&usqp=CAc",alt:["https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500&q=80","https://images.pexels.com/photos/336372/pexels-photo-336372.jpeg?auto=compress&cs=tinysrgb&w=500"]},
 {name:"Smartwatch",price:"₹12,999",badge:"High Cost",action:"Not now",color:"#ef5350",img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRaXfPk8g5WrNcc6jFQI9ZkGdenIdC-AsjiqYy2EJEgA&s",alt:["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80","https://images.pexels.com/photos/437037/pexels-photo-437037.jpeg?auto=compress&cs=tinysrgb&w=500"]}
];
const CENTER=2, N=PRODUCTS.length;
const stage=document.getElementById('stage'),track=document.getElementById('track'),dotsEl=document.getElementById('dots');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Inline SVG fallback if a photo fails to load */
const fallback=n=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#e9eeee"/><text x="150" y="155" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#456">${n}</text></svg>`);

/* Build cards */
const slots=PRODUCTS.map((p,i)=>{
  const s=document.createElement('div');s.className='slot';
  s.innerHTML=`<article class="card" style="--ac:${p.color};--t:${5+i*.7}s;--d:${-i*1.1}s">
    <span class="badge"><i></i>${p.badge}</span>
    <div class="photo"><img alt="${p.name}" loading="eager"></div>
    <div class="name">${p.name}</div><div class="price">${p.price}</div>
    <div class="act">${p.action}</div></article>`;
  const img=s.querySelector('img');
  const srcs=[p.img,...(p.alt||[]),fallback(p.name)];let k=0;
  img.onerror=()=>{k++;if(k<srcs.length)img.src=srcs[k]};
  img.referrerPolicy='no-referrer';img.src=srcs[0];
  track.appendChild(s);
  const d=document.createElement('button');d.setAttribute('aria-label',p.name);d.onclick=()=>goTo(i);dotsEl.appendChild(d);
  return s;
});

/* ===== Carousel: continuous position t, eased toward target (no snapping) ===== */
let pos=CENTER,target=CENTER,hover=false,last=performance.now(),timer=0;
const wrap=v=>((v+N/2)%N+N)%N-N/2;           // wrap offset into [-2.5,2.5)
function layout(){
  const W=stage.clientWidth,cw=Math.min(250,Math.max(120,W*.2)),sx=Math.min(W*.215,280);
  stage.style.setProperty('--cw',cw+'px');
  slots.forEach((s,i)=>{
    const o=wrap(i-pos),a=Math.abs(o);
    const scale=1.15-.22*Math.min(a,2),z=-a*90;
    s.style.transform=`translateX(${o*sx*(1-.08*a)}px) translateZ(${z}px) rotateY(${-o*22}deg) scale(${scale})`;
    s.style.opacity=Math.max(0,Math.min(1,(2.5-a)*2))*(1-.15*Math.min(a,2)/2); // far edge fades while wrapping
    s.style.zIndex=Math.round(10-a*3);
    s.style.filter=`brightness(${1-.25*Math.min(a,1.6)})`;
    s.firstElementChild.classList.toggle('main',a<.5);
  });
  const c=((Math.round(pos)%N)+N)%N;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===c));
}
function goTo(i){ // shortest path to product i being centered
  target=pos+wrap(i-pos);timer=0; // product i is centered when pos == i
}
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!reduce&&!hover){timer+=dt;if(timer>3.2){target=Math.round(target)+1;timer=0}}
  pos+=(target-pos)*(1-Math.exp(-dt*3.2));        // exponential ease = smooth, no jumps
  if(pos>N*2){pos-=N;target-=N}
  layout();requestAnimationFrame(tick);
}
stage.addEventListener('mouseenter',()=>hover=true);
stage.addEventListener('mouseleave',()=>hover=false);
stage.addEventListener('touchstart',()=>{hover=true;setTimeout(()=>hover=false,4000)},{passive:true});
addEventListener('resize',layout);
requestAnimationFrame(tick);
</script>
</body>
</html>
